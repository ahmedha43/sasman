# mediamtx.yml
# Low-overhead, lightweight configuration tailored for MikroTik RouterOS container environments

# Enable RTMP (Publishing from OBS or other devices)
rtmp: yes
rtmpAddress: :1935

# Enable HLS (Viewing on Web browsers, mobile phones, etc.)
hls: yes
hlsAddress: :8888

# Disable unused protocols to save RAM and CPU overhead on limited hardware
rtsp: no
webrtc: no
srt: no

# Performance optimizations for local LAN streaming
hlsSegmentCount: 7        # Number of segments to keep in history (LL-HLS requires at least 7)
hlsSegmentDuration: 2s    # Target duration of each segment (low = lower latency)
hlsPartDuration: 200ms



# Admin/Control API enabling local Go backend to query stream status and active publishers
api: yes
apiAddress: 127.0.0.1:9997

# Default paths config
paths:
  all:
    source: publisher     # Accept incoming RTMP publishing
    sourceOnDemand: no
