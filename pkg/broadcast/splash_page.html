<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: linear-gradient(135deg, #020617, #0f172a);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .ad-card {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #06b6d4;
      border-radius: 20px;
      padding: 28px 24px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 30px rgba(6, 182, 212, 0.15);
      text-align: center;
      animation: fadeIn 0.4s ease;
    }
    .ad-badge {
      display: inline-block;
      background: #083344;
      color: #22d3ee;
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 14px;
      border: 1px solid #0891b2;
    }
    .ad-title {
      font-size: 1.35rem;
      font-weight: bold;
      color: #22d3ee;
      margin-bottom: 14px;
      line-height: 1.4;
    }
    .ad-image {
      max-width: 100%;
      max-height: 200px;
      border-radius: 12px;
      margin-bottom: 16px;
      border: 1px solid #334155;
      object-fit: cover;
    }
    .ad-message {
      font-size: 14px;
      color: #cbd5e1;
      line-height: 1.7;
      margin-bottom: 24px;
      white-space: pre-wrap;
      text-align: right;
      background: #1e293b;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-action {
      background: linear-gradient(135deg, #06b6d4, #0284c7);
      color: #fff;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      text-decoration: none;
      border: none;
      cursor: pointer;
      display: block;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.4);
    }
    .btn-continue {
      background: #334155;
      color: #94a3b8;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: not-allowed;
      transition: all 0.2s;
    }
    .btn-continue.ready {
      background: #1e293b;
      color: #22c55e;
      border: 1px solid #22c55e;
      cursor: pointer;
    }
    .btn-continue.ready:hover {
      background: #14532d;
      color: #dcfce7;
    }
    .countdown-text {
      font-size: 12px;
      color: #64748b;
      margin-top: 6px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="ad-card">
    <div class="ad-badge">📢 إشعار هام من مزود الخدمة</div>
    <div class="ad-title">{{TITLE}}</div>
    
    <div id="img-container" style="display:none;">
      <img src="{{IMAGE_URL}}" class="ad-image" id="ad-img" onerror="this.parentElement.style.display='none'">
    </div>

    <div class="ad-message">{{MESSAGE}}</div>

    <div class="btn-container">
      <div id="action-btn-wrap" style="display:none;">
        <a href="{{ACTION_URL}}" target="_blank" class="btn-action" onclick="onActionClick()">{{ACTION_TEXT}}</a>
      </div>

      <button id="btn-continue" class="btn-continue" onclick="dismissAndContinue()">
        ⏳ يرجى الانتظار (<span id="count-num">{{DURATION}}</span> ثوانٍ)
      </button>
    </div>

    <div class="countdown-text">سيتم تحويلك إلى التصفح الطبيعي تلقائياً.</div>
  </div>

  <script>
    const campaignId = "{{CAMPAIGN_ID}}";
    const clientIp = "{{CLIENT_IP}}";
    const imageUrl = "{{IMAGE_URL}}";
    const actionUrl = "{{ACTION_URL}}";
    const actionText = "{{ACTION_TEXT}}";
    let timeLeft = parseInt("{{DURATION}}", 10) || 10;

    if (imageUrl && imageUrl.trim() !== "") {
      document.getElementById('img-container').style.display = 'block';
    }
    if (actionUrl && actionUrl.trim() !== "" && actionText && actionText.trim() !== "") {
      document.getElementById('action-btn-wrap').style.display = 'block';
    }

    const countNum = document.getElementById('count-num');
    const btnContinue = document.getElementById('btn-continue');

    const timer = setInterval(() => {
      timeLeft--;
      if (countNum) countNum.innerText = timeLeft;

      if (timeLeft <= 0) {
        clearInterval(timer);
        btnContinue.classList.add('ready');
        btnContinue.innerText = '🚀 متابعة تصفح الإنترنت الآن ✓';
      }
    }, 1000);

    function dismissAndContinue() {
      if (timeLeft > 0) return; // not ready yet
      fetch(`/broadcast/dismiss?id=${encodeURIComponent(campaignId)}&ip=${encodeURIComponent(clientIp)}&clicked=0`, {
        method: 'GET'
      }).finally(() => {
        window.location.href = "http://google.com";
      });
    }

    function onActionClick() {
      fetch(`/broadcast/dismiss?id=${encodeURIComponent(campaignId)}&ip=${encodeURIComponent(clientIp)}&clicked=1`, {
        method: 'GET'
      }).catch(()=>{});
    }
  </script>
</body>
</html>
