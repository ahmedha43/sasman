<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SASMAN Cloud | تسجيل دخول الوكيل السحابي</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; }
    .glass {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

  <!-- Background Gradients -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl"></div>
    <div class="absolute top-1/2 -right-40 w-96 h-96 bg-cyan-600/20 rounded-full blur-3xl"></div>
  </div>

  <!-- Header -->
  <header class="relative z-10 w-full max-w-6xl mx-auto px-6 py-6 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-cyan-400 flex items-center justify-center font-black text-xl shadow-lg shadow-indigo-500/20">S</div>
      <div>
        <span class="text-xl font-black tracking-wide bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-cyan-300">SASMAN</span>
        <span class="text-xs bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded-full border border-indigo-500/30 mr-1.5 font-bold">Cloud Edition</span>
      </div>
    </div>
    <a href="/cloud/register" class="text-sm font-semibold text-indigo-400 hover:text-indigo-300 transition flex items-center gap-1">
      تسجيل حساب جديد &larr;
    </a>
  </header>

  <!-- Login Card -->
  <main class="relative z-10 w-full max-w-md mx-auto px-6 py-12">
    <div class="glass rounded-3xl p-8 shadow-2xl relative overflow-hidden">
      
      <div class="text-center mb-8">
        <h1 class="text-3xl font-black text-white mb-2">تسجيل الدخول السحابي</h1>
        <p class="text-slate-400 text-sm">أدخل اسم النطاق وكلمة المرور للوصول إلى لوحة التحكم</p>
      </div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1.5">اسم النطاق (Subdomain)</label>
          <div class="relative flex items-center" dir="ltr">
            <input type="text" id="subdomain" required placeholder="moonnet" class="w-full bg-slate-900/80 border border-slate-800 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 rounded-xl px-4 py-3 text-sm transition outline-none text-white font-mono placeholder-slate-600 lowercase">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1.5">كلمة المرور</label>
          <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-900/80 border border-slate-800 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 rounded-xl px-4 py-3 text-sm transition outline-none text-white placeholder-slate-500 text-left" dir="ltr">
        </div>

        <div id="errorBox" class="hidden p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs font-medium text-center"></div>

        <button type="submit" id="submitBtn" class="w-full mt-6 py-3.5 px-6 rounded-xl bg-gradient-to-r from-indigo-500 to-cyan-500 hover:from-indigo-600 hover:to-cyan-600 font-bold text-sm shadow-lg shadow-indigo-500/25 transition transform active:scale-95 flex items-center justify-center gap-2">
          <span>تسجيل الدخول</span>
          <svg id="spinner" class="hidden animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
        </button>
      </form>

      <div class="mt-6 text-center">
        <span class="text-xs text-slate-400">ليس لديك حساب سحابي بعد؟ </span>
        <a href="/cloud/register" class="text-xs text-indigo-400 hover:underline font-bold">أنشئ شبكتك الآن</a>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="relative z-10 py-6 text-center text-xs text-slate-500">
    نظام SASMAN السحابي الموحد &copy; 2026 | حماية وتشفير تام RFC 6614 RadSec
  </footer>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('errorBox');
      const submitBtn = document.getElementById('submitBtn');
      const spinner = document.getElementById('spinner');

      errBox.classList.add('hidden');
      submitBtn.disabled = true;
      spinner.classList.remove('hidden');

      const payload = {
        subdomain: document.getElementById('subdomain').value.trim().toLowerCase(),
        password: document.getElementById('password').value
      };

      try {
        const res = await fetch('/cloud/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (!data.success) {
          throw new Error(data.error || 'فشل تسجيل الدخول');
        }

        // Redirect to cloud dashboard
        window.location.href = `/cloud/dashboard?sub=${data.tenant.subdomain}`;

      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        spinner.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
