<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - SASMAN Central Cloud</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary: #0ea5e9;
      --primary-hover: #0284c7;
      --bg-dark: #090d16;
      --card-bg: rgba(15, 23, 42, 0.85);
      --border-color: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top right, #0f172a, #020617 80%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    /* Subtle glowing tech orb background */
    .bg-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.15), transparent 70%);
      top: -100px;
      right: -100px;
      pointer-events: none;
    }
    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 40px 36px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      position: relative;
      z-index: 10;
    }
    .brand-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .brand-icon {
      font-size: 38px;
      color: var(--primary);
      margin-bottom: 12px;
      display: inline-block;
      filter: drop-shadow(0 0 12px rgba(14, 165, 233, 0.5));
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      color: var(--text-muted);
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
    }
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrap i {
      position: absolute;
      right: 14px;
      color: #64748b;
      font-size: 14px;
      pointer-events: none;
    }
    input {
      width: 100%;
      padding: 12px 42px 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(11, 19, 41, 0.8);
      color: #f8fafc;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2);
      background: rgba(15, 23, 42, 0.95);
    }
    button.btn-submit {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
      margin-top: 8px;
    }
    button.btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.5);
    }
    .error-msg {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--danger);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      color: #fca5a5;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 8px;
    }
    .footer {
      text-align: center;
      margin-top: 28px;
      font-size: 12px;
      color: #64748b;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 16px;
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <div class="login-card">
    <div class="brand-header">
      <div class="brand-icon"><i class="fa-solid fa-cloud-bolt"></i></div>
      <h1>SASMAN Cloud Server</h1>
      <p class="subtitle">لوحة الإدارة المركزية والتحكم بشبكة الوكلاء</p>
    </div>
    
    <div id="error-box" class="error-msg">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span id="error-text"></span>
    </div>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label><i class="fa-solid fa-user"></i> اسم المستخدم (Username):</label>
        <div class="input-wrap">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="username" placeholder="admin" required autofocus>
        </div>
      </div>
      <div class="form-group">
        <label><i class="fa-solid fa-lock"></i> كلمة المرور (Password):</label>
        <div class="input-wrap">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
      </div>
      <button type="submit" id="submit-btn" class="btn-submit">
        <i class="fa-solid fa-arrow-right-to-bracket"></i>
        <span>تسجيل الدخول</span>
      </button>
    </form>

    <div class="footer">
      SASMAN High-Performance Cloud Architecture v5.0
    </div>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const errBox = document.getElementById('error-box');
      const errText = document.getElementById('error-text');
      const btn = document.getElementById('submit-btn');
      
      errBox.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>جاري التحقق...</span>';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = '/admin';
        } else {
          errText.innerText = data.error || 'اسم المستخدم أو كلمة المرور غير صحيحة';
          errBox.style.display = 'flex';
        }
      } catch (err) {
        errText.innerText = 'تعذر الاتصال بالسيرفر المركزي';
        errBox.style.display = 'flex';
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> <span>تسجيل الدخول</span>';
      }
    }
  </script>
</body>
</html>
