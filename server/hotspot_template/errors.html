<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SASMAN Global HotSpot | تنبيه وتفاصيل الخطأ</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --primary-glow: rgba(2, 132, 199, 0.4);
            --bg-dark: #060913;
            --card-bg: rgba(15, 23, 42, 0.9);
            --card-border: rgba(239, 68, 68, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --error-bg: rgba(239, 68, 68, 0.12);
            --error-border: #ef4444;
            --radius-xl: 24px;
            --radius-md: 12px;
            --transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(239, 68, 68, 0.18) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(2, 132, 199, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px 16px;
        }

        .error-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-xl);
            padding: 36px 26px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 30px rgba(239, 68, 68, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            animation: appear 0.4s ease-out;
        }

        @keyframes appear {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon {
            font-size: 52px;
            margin-bottom: 12px;
        }

        .title {
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 18px;
        }

        .error-msg {
            color: #fca5a5;
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            padding: 14px 16px;
            border-radius: var(--radius-md);
            margin-bottom: 24px;
            font-weight: 700;
            font-size: 14px;
            line-height: 1.5;
            direction: rtl;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #fff;
            text-decoration: none;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 6px 18px var(--primary-glow);
            transition: var(--transition);
        }

        .btn:hover {
            background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="icon">⚠️</div>
        <h1 class="title">تعذر إكمال تسجيل الدخول</h1>
        <p class="subtitle">حدث خطأ أثناء محاولة المصادقة والاتصال بالشبكة</p>
        
        <div class="error-msg">
            $(error)
        </div>

        <a href="$(link-login)" class="btn">
            <span>العودة للمحاولة من جديد</span> 🔄
        </a>
    </div>
</body>
</html>
