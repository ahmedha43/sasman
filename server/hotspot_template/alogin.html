<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SASMAN Global HotSpot | جاري التحويل...</title>
    <meta http-equiv="refresh" content="2; url=$(link-redirect)">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <style>
        :root {
            --primary: #0284c7;
            --accent: #38bdf8;
            --bg-dark: #060913;
            --card-bg: rgba(15, 23, 42, 0.9);
            --card-border: rgba(56, 189, 248, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --radius-xl: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(2, 132, 199, 0.2) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px 16px;
        }

        .box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-xl);
            padding: 38px 28px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 35px rgba(2, 132, 199, 0.2);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            animation: appear 0.4s ease-out;
        }

        @keyframes appear {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .spinner-wrapper {
            position: relative;
            width: 56px;
            height: 56px;
            margin: 0 auto 20px;
        }

        .spinner {
            width: 100%;
            height: 100%;
            border: 4px solid rgba(2, 132, 199, 0.18);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.75s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        h2 {
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 8px;
        }

        p {
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 700;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
    <script>
        function start() {
            if (window.location.href.indexOf('?') === -1) {
                window.location.href = '$(link-redirect)';
            }
        }
    </script>
</head>
<body onload="start()">
    <div class="box">
        <div class="spinner-wrapper">
            <div class="spinner"></div>
        </div>
        <h2>تم الاتصال بالإنترنت بنجاح! 🚀</h2>
        <p>جاري تحويلك إلى صفحة التصفح...<br>إذا لم يتم التحويل تلقائياً، اضغط <a href="$(link-redirect)">هنا</a></p>
    </div>
</body>
</html>
