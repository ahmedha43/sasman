[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:sasman]
command=/app/main
directory=/app
environment=GODEBUG="x509negativeserial=1"
autostart=true
autorestart=true
startsecs=5
priority=20
stdout_logfile=/app/data/sasman.log
stderr_logfile=/app/data/sasman.log

[program:cloudflared]
command=/usr/local/bin/cloudflared tunnel --url http://localhost:80
autostart=false
autorestart=true
startsecs=5
priority=30
stdout_logfile=/app/data/cloudflared.log
stderr_logfile=/app/data/cloudflared.log
