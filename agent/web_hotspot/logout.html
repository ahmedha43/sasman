<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SASMAN Global HotSpot | تم تسجيل الخروج</title>
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --bg-dark: #090d16;
            --card-bg: rgba(15, 23, 42, 0.88);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --radius-lg: 20px;
            --radius-md: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            color: var(--text-main);
        }

        .card {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 32px 26px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(16px);
        }

        .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 13.5px;
            color: var(--text-muted);
            margin-bottom: 22px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 13px;
            background: var(--primary);
            color: #fff;
            text-decoration: none;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: var(--primary-hover);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">👋</div>
        <h1 class="title">تم تسجيل الخروج بنجاح</h1>
        <p class="subtitle">شكراً لاستخدامك شبكة SASMAN Global HotSpot</p>

        <a href="$(link-login)" class="btn">تسجيل الدخول من جديد 🔄</a>
    </div>

</body>
</html>
