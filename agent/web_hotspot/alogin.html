<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SASMAN Global HotSpot | جاري التحويل...</title>
    <meta http-equiv="refresh" content="2; url=$(link-redirect)">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <style>
        body {
            background-color: #090d16;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .box {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 36px 28px;
            max-width: 420px;
            width: 100%;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(2, 132, 199, 0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h2 { font-size: 20px; margin-bottom: 8px; }
        p { font-size: 13.5px; color: #94a3b8; }
        a { color: #38bdf8; text-decoration: none; font-weight: 600; }
    </style>
    <script>
        function start() {
            if (window.location.href.indexOf('?') === -1) {
                window.location.href = '$(link-redirect)';
            }
        }
    </script>
</head>
<body onload="start()">
    <div class="box">
        <div class="spinner"></div>
        <h2>تم الاتصال بالإنترنت بنجاح!</h2>
        <p>جاري تحويلك إلى وجهتك... إذا لم يتم التحويل اضغط <a href="$(link-redirect)">هنا</a></p>
    </div>
</body>
</html>
