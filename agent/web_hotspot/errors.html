<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SASMAN Global HotSpot | خطأ</title>
    <style>
        body {
            background-color: #090d16;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .box {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 20px;
            padding: 32px 24px;
            max-width: 420px;
            width: 100%;
        }
        .error-msg {
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.1);
            padding: 12px;
            border-radius: 8px;
            margin: 16px 0 24px;
            font-weight: 600;
        }
        a {
            display: inline-block;
            padding: 10px 24px;
            background: #0284c7;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>تعذر تسجيل الدخول</h2>
        <div class="error-msg">$(error)</div>
        <a href="$(link-login)">العودة للمحاولة من جديد 🔄</a>
    </div>
</body>
</html>
