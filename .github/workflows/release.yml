name: Build & Publish Releases to Public Distribution Repo

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-and-publish:
    name: Cross-Compile & Publish Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code (Private Repo)
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Determine Version Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Cross-Compile Agent Binaries (3 Architectures)
        run: |
          mkdir -p dist

          echo "==> Building Linux ARM64 (CCR2004, RB5009, L009)..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/sasman-agent-arm64 main.go
          tar -czvf dist/sasman-agent-linux-arm64.tar.gz -C dist sasman-agent-arm64
          rm -f dist/sasman-agent-arm64

          echo "==> Building Linux AMD64 (x86_64, CHR, PC Server)..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/sasman-agent-amd64 main.go
          tar -czvf dist/sasman-agent-linux-amd64.tar.gz -C dist sasman-agent-amd64
          rm -f dist/sasman-agent-amd64

          echo "==> Building Linux ARMv7 (RB4011, hAP ax2, hAP ax3)..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w" -o dist/sasman-agent-armv7 main.go
          tar -czvf dist/sasman-agent-linux-armv7.tar.gz -C dist sasman-agent-armv7
          rm -f dist/sasman-agent-armv7

          echo "==> Built files:"
          ls -lh dist/

      - name: Publish Release to Public Repository (sasman-release)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          echo "Publishing release $VERSION to ahmedha43/sasman-release..."
          gh release create "$VERSION" \
            --repo "ahmedha43/sasman-release" \
            --title "SASMAN Agent Release $VERSION" \
            --notes "🚀 **SASMAN MikroTik Agent & Containerized System Release $VERSION**

          ### 📦 Pre-compiled Packages:
          - \`sasman-agent-linux-arm64.tar.gz\`: 64-bit ARM (CCR2004, RB5009, L009, ARM64)
          - \`sasman-agent-linux-amd64.tar.gz\`: 64-bit x86_64 (CHR, x86 PC, Cloud VPS)
          - \`sasman-agent-linux-armv7.tar.gz\`: 32-bit ARM (RB4011, hAP ax2/ax3)

          Statically compiled with zero external dependencies." \
            dist/sasman-agent-linux-arm64.tar.gz \
            dist/sasman-agent-linux-amd64.tar.gz \
            dist/sasman-agent-linux-armv7.tar.gz
