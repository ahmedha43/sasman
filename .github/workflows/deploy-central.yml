name: Deploy SASMAN Central Server to VPS

on:
  push:
    branches: [ "main" ]
    paths:
      - 'server/**'
      - 'pkg/**'
      - 'go.mod'
      - 'go.sum'
      - 'deploy_central.ps1'
      - '.github/workflows/deploy-central.yml'
  workflow_dispatch:
    inputs:
      vps_host:
        description: 'VPS Host IP'
        required: false
        default: '167.86.73.203'
      force_deploy:
        description: 'Force deployment'
        required: false
        type: boolean
        default: true

concurrency:
  group: deploy-central-server
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build Central Server & Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Central Server Docker Image
        run: |
          echo "=========================================="
          echo " STEP 1/3 | Building Central Server Image"
          echo "=========================================="
          docker build -f server/Dockerfile -t server-central:new .
          docker images server-central:new

      - name: Stream Image & Deploy on VPS via SSH
        env:
          VPS_HOST: ${{ github.event.inputs.vps_host || secrets.VPS_HOST || '167.86.73.203' }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          VPS_PASS: ${{ secrets.VPS_PASS || 'mushtaq99' }}
          ADMIN_PASS: ${{ secrets.SASMAN_ADMIN_PASSWORD || 'Mushtaq@Sasman#9977!' }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y sshpass

          export SSHPASS="$VPS_PASS"
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30"

          echo "=========================================="
          echo " STEP 2/3 | Streaming Docker Image to VPS"
          echo "=========================================="
          docker save server-central:new | sshpass -e ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" "docker load"

          echo "=========================================="
          echo " STEP 3/3 | Restarting Container on VPS"
          echo "=========================================="
          sshpass -e ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" "
            set -e
            
            # 1. Update Nginx configuration
            sed -i '/client_max_body_size/d' /etc/nginx/nginx.conf || true
            sed -i '/http {/a \    client_max_body_size 256M;' /etc/nginx/nginx.conf || true
            (nginx -t && systemctl reload nginx) || true

            # 2. Stop and remove old container
            docker stop sasman-central || true
            docker rm sasman-central || true

            # 3. Create persistent directories
            mkdir -p /root/sasman-central/server/data /root/sasman-central/server/data/releases

            # 4. Run new container
            docker run -d \
              --name sasman-central \
              --restart unless-stopped \
              --network host \
              -e ADDR=:8080 \
              -e SASMAN_CENTRAL_DOMAIN=sas-man.net \
              -e SASMAN_DB_PATH=/app/data/sasman-central.db \
              -e SASMAN_ADMIN_USER=admin \
              -e SASMAN_ADMIN_PASSWORD='${ADMIN_PASS}' \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v /root/sasman-central/server/data:/app/data \
              server-central:new

            # 5. Check startup
            sleep 4
            docker ps --filter name=sasman-central
            echo '--- RECENT LOGS ---'
            docker logs sasman-central --tail 25

            # 6. Health check
            echo '--- RUNNING HEALTH CHECK ---'
            for i in \$(seq 1 10); do
              if curl -s -f http://127.0.0.1:8080/health > /dev/null; then
                echo '✅ Health check passed (HTTP 200 OK)!'
                exit 0
              fi
              echo \"Waiting for central server to respond (\$i/10)...\"
              sleep 2
            done
            echo '❌ Health check timed out!'
            docker logs sasman-central --tail 50
            exit 1
          "
