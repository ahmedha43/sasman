name: Build & Release SASMAN Multi-Architecture

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. 5.1.0)'
        required: true
        default: '5.1.0'

permissions:
  contents: write
  packages: write

jobs:
  # ─── Job 1: Build each architecture in parallel across independent runners ──
  build-arch:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: armv7
            platform: linux/arm/v7
            tar: sasman-armv7.tar
            bin: sasman-agent-linux-armv7
          - arch: arm64
            platform: linux/arm64
            tar: sasman-arm64.tar
            bin: sasman-agent-linux-arm64
          - arch: amd64
            platform: linux/amd64
            tar: sasman-amd64.tar
            bin: sasman-agent-linux-amd64

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image & Binary
        run: |
          mkdir -p output
          echo "Building for ${{ matrix.platform }}..."
          docker buildx build --platform ${{ matrix.platform }} -t sasman:${{ matrix.arch }} --load .
          
          # Save container TAR for MikroTik
          docker save sasman:${{ matrix.arch }} -o output/${{ matrix.tar }}
          
          # Extract agent binary
          CID=$(docker create --platform ${{ matrix.platform }} sasman:${{ matrix.arch }})
          docker cp $CID:/app/main output/${{ matrix.bin }}
          docker rm -f $CID
          
          ls -lh output/

      - name: Upload Single Architecture Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sasman-${{ matrix.arch }}
          path: output/*
          retention-days: 7

  # ─── Job 2: Push Multi-Arch Image to Docker Hub (if secrets provided) ───────
  docker-hub-push:
    name: Push Multi-Arch Docker Hub Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Multi-Arch Image
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm/v7,linux/arm64,linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sasman-manager:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sasman-manager:v5
            ${{ secrets.DOCKERHUB_USERNAME }}/sasman-manager:${{ github.event.inputs.version || '5.1.0' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # ─── Job 3: Merge all artifacts and create Release ──────────────────────────
  release:
    name: Consolidate Releases & Create GitHub Release
    needs: [build-arch]
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: releases-temp

      - name: Prepare Final Releases Folder & Checksums
        run: |
          mkdir -p releases
          find releases-temp -type f -exec cp {} releases/ \;
          cd releases
          sha256sum * > SHA256SUMS.txt || true
          ls -lh

      - name: Upload Unified Releases Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sasman-all-releases
          path: releases/*
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: "SASMAN Release ${{ github.event.inputs.version || github.ref_name }}"
          draft: false
          prerelease: false
          files: releases/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
