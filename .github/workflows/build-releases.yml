name: Build & Release SASMAN Multi-Architecture

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. 5.1.0)'
        required: true
        default: '5.1.0'

permissions:
  contents: write
  packages: write

jobs:
  # ─── Job 1: Build each architecture in parallel across independent runners ──
  build-arch:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: armv7
            platform: linux/arm/v7
            tar: sasman-armv7.tar
            bin: sasman-agent-linux-armv7
          - arch: arm64
            platform: linux/arm64
            tar: sasman-arm64.tar
            bin: sasman-agent-linux-arm64
          - arch: amd64
            platform: linux/amd64
            tar: sasman-amd64.tar
            bin: sasman-agent-linux-amd64

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image & Binary
        run: |
          mkdir -p output
          echo "Building for ${{ matrix.platform }}..."
          docker buildx build --platform ${{ matrix.platform }} -f agent/Dockerfile -t sasman:${{ matrix.arch }} --load .
          
          # Save container TAR for MikroTik
          docker save sasman:${{ matrix.arch }} -o output/${{ matrix.tar }}
          
          # Extract agent binary
          CID=$(docker create --platform ${{ matrix.platform }} sasman:${{ matrix.arch }})
          docker cp $CID:/app/main output/${{ matrix.bin }}
          docker rm -f $CID
          
          ls -lh output/

      - name: Upload Single Architecture Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sasman-${{ matrix.arch }}
          path: output/*
          retention-days: 7

  # ─── Job 2: Push Multi-Arch Image to Docker Hub (if secrets provided) ───────
  docker-hub-push:
    name: Push Multi-Arch Docker Hub Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Calculate Version Tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION="${VERSION#v}"
          else
            VERSION="5.1.0"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build & Push Multi-Arch Image
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./agent/Dockerfile
          platforms: linux/arm/v7,linux/arm64,linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sasman-manager:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sasman-manager:v5
            ${{ secrets.DOCKERHUB_USERNAME }}/sasman-manager:${{ steps.ver.outputs.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/sasman-manager:v${{ steps.ver.outputs.VERSION }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # ─── Job 3: Merge all artifacts and create Release ──────────────────────────
  release:
    name: Consolidate Releases & Create GitHub Release
    needs: [build-arch]
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: releases-temp

      - name: Prepare Final Releases Folder & Checksums
        run: |
          mkdir -p releases
          find releases-temp -type f -exec cp {} releases/ \;
          cd releases
          sha256sum * > SHA256SUMS.txt || true
          ls -lh

      - name: Calculate Version Tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v5.1.${{ github.run_number }}"
          fi
          if [[ "$TAG" != v* ]]; then TAG="v$TAG"; fi
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release (Internal Repo)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "SASMAN Release ${{ env.TAG }}"
          draft: false
          prerelease: false
          files: releases/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Release to Public Repo (ahmedha43/sasman-release)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "Publishing release $TAG to ahmedha43/sasman-release..."
          gh release create "$TAG" releases/* \
            --repo "ahmedha43/sasman-release" \
            --title "SASMAN Multi-Arch Release $TAG" \
            --notes "🚀 **SASMAN MikroTik Agent & Containerized System Release $TAG**

          ### 📦 Pre-compiled Container Packages for MikroTik:
          - \`sasman-arm64.tar\`: 64-bit ARM (CCR2004, RB5009, L009, CHR ARM)
          - \`sasman-armv7.tar\`: 32-bit ARM (RB4011, hAP ax2/ax3)
          - \`sasman-amd64.tar\`: 64-bit x86_64 (CHR, x86 PC Server)

          ### 🔧 Standalone Agent Binaries:
          - \`sasman-agent-linux-arm64\`
          - \`sasman-agent-linux-armv7\`
          - \`sasman-agent-linux-amd64\`

          Checksums verified in \`SHA256SUMS.txt\`." || \
          gh release upload "$TAG" releases/* --repo "ahmedha43/sasman-release" --clobber || true
