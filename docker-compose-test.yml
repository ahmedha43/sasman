version: '3.8'

services:
  # السيرفر المركزي - بوابة التنل
  sasman-central:
    image: sasman-central
    container_name: sasman-central
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - central_data:/app/data
    environment:
      - ADDR=:8080
      - SASMAN_CENTRAL_DOMAIN=sas-man.net
      - SASMAN_DB_PATH=/app/data/sasman-central.db

  # النظام الأساسي - الوكيل (Agent) متصل بالسيرفر المركزي
  sasman-test:
    image: sasman-test
    container_name: sasman-test
    cap_add:
      - NET_ADMIN
    restart: always
    network_mode: host
    depends_on:
      - sasman-central
    volumes:
      - ./data:/app/data
    environment:
      - PORT=80
      - GODEBUG=x509negativeserial=1
      - SASMAN_TUNNEL_MODE=agent
      - SASMAN_SUBDOMAIN=test-ahmed
      - SASMAN_TUNNEL_TOKEN=tok-test-12345
      - SASMAN_TUNNEL_GATEWAY_URL=ws://127.0.0.1:8080/ws

volumes:
  central_data: